[project]
name = "fastagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # 核心 AI
    "openai>=1.109.1",
    "torch>=2.10.0",
    "transformers>=5.0.0",
    "tiktoken>=0.12.0",
    # 核心框架
    "fastmcp>=2.14.4",
    # HTTP/网络
    "aiohttp>=3.13.3",
    # 工具类
    "loguru>=0.7.3",
    "python-dotenv>=1.2.1",
    "tenacity>=9.1.2",
    # 数据库
    "redis>=7.1.0",
    "psycopg2-binary>=2.9.11",
    "pymilvus>=2.6.8",
    # NLP
    "jieba>=0.42.1",
]

[tool.setuptools]
# 明确列出所有包
packages = ["fastagent"]
